<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>REVORA — Банери</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0e;color:#f6f1e9;font:15px/1.5 system-ui,Arial}main{max-width:850px;margin:auto;padding:24px 18px 60px}header{border-bottom:1px solid #34302a;padding:22px 5%;display:flex;justify-content:space-between;gap:14px;align-items:center}a{color:#d9b787;text-decoration:none}h1{font:36px Georgia;margin:20px 0 6px}p{color:#b3aca3}.panel{background:#151719;border:1px solid #38332d;border-radius:13px;padding:24px;margin-top:20px}label{display:block;color:#c7b9a5;font-size:13px;margin-top:15px}input,textarea,select{display:block;width:100%;padding:12px;margin-top:6px;background:#0c0d0e;border:1px solid #50473c;color:white;border-radius:8px;font:inherit}textarea{min-height:85px}button{border:1px solid #b6986c;border-radius:8px;background:#cbaa7c;color:#15110c;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}#editor[hidden],#login[hidden]{display:none}#notice{color:#e6c18b}.preview{border-radius:12px;background:linear-gradient(120deg,#29231d,#111317);padding:28px;margin-top:22px;border:1px solid #5b4b36;min-height:175px}.preview h2{font:32px Georgia;white-space:pre-line}.preview p{color:#eee}small{color:#b9a78e}@media(max-width:600px){header{padding:18px}h1{font-size:29px}.panel{padding:16px}.preview h2{font-size:25px}}
</style></head><body><header><b>REVORA · БАНЕРИ</b><a href="/admin/">← Адмін-панель</a></header><main><h1>Налаштування банерів</h1><p>Редагуй три слайди головної сторінки магазину. Зміни зберігаються в Supabase.</p><p id="notice" role="status">Перевіряємо доступ…</p><button id="login" hidden>Увійти через Google</button><div id="editor" hidden><div class="panel"><label>Банер<select id="slot"><option value="1">Банер 1 — NEW SEASON</option><option value="2">Банер 2 — NEW DROP</option><option value="3">Банер 3 — SALE</option></select></label><label>Малий заголовок<input id="eyebrow" maxlength="120"></label><label>Головний заголовок<input id="title" maxlength="160"></label><label>Опис<textarea id="description" maxlength="500"></textarea></label><label>Текст кнопки<input id="button_text" maxlength="100"></label><label>Посилання кнопки (catalog.html або #секція)<input id="button_url" maxlength="300"></label><label>Напис на зображенні<input id="visual_label" maxlength="100"></label><label>Великий текст на зображенні<input id="visual_title" maxlength="120"></label><label>Підпис на зображенні<input id="visual_caption" maxlength="120"></label><label>URL зображення (https://)<input id="image_url" maxlength="1500" placeholder="https://..."></label><button id="save">ЗБЕРЕГТИ БАНЕР</button></div><div class="preview" id="preview"><small id="previewEyebrow"></small><h2 id="previewTitle"></h2><p id="previewDescription"></p><small id="previewButton"></small></div></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://mqsytqicykgtbjjvaroa.supabase.co','sb_publishable_uzjZ93fo6a0DJJaKUqK6ng_S8SCS7mH',{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);const fields=['eyebrow','title','description','button_text','button_url','visual_label','visual_title','visual_caption','image_url'];
const defaults=[
{eyebrow:'REVORA · NEW SEASON 2026',title:'Нова естетика твого стилю.',description:'Відібраний одяг, взуття та аксесуари для сильних повсякденних образів.',button_text:'ПЕРЕГЛЯНУТИ КОЛЕКЦІЮ',button_url:'catalog.html',visual_label:'REVORA EDIT 01',visual_title:'NEW SEASON',visual_caption:'Обирай свою колекцію'},
{eyebrow:'REVORA · LATEST DROP',title:'Новий дроп. Новий образ.',description:'Новинки REVORA — речі, які легко поєднати в одному гардеробі.',button_text:'ДИВИТИСЯ НОВИНКИ',button_url:'catalog.html?sort=new',visual_label:'REVORA EDIT 02',visual_title:'NEW DROP',visual_caption:'Оновлення асортименту'},
{eyebrow:'REVORA · SELECTED OFFERS',title:'SALE. Обрані позиції.',description:'Актуальні знижки на вибрані товари REVORA.',button_text:'ПЕРЕЙТИ ДО SALE',button_url:'catalog.html?sale=1',visual_label:'REVORA EDIT 03',visual_title:'SALE',visual_caption:'Обрані пропозиції REVORA'}];
let rows=[];
function preview(){ $('previewEyebrow').textContent=$('eyebrow').value;$('previewTitle').textContent=$('title').value;$('previewDescription').textContent=$('description').value;$('previewButton').textContent=$('button_text').value;const url=$('image_url').value.trim();$('preview').style.backgroundImage=/^https:\/\//.test(url)?'linear-gradient(90deg,#000a,#0006),url("'+encodeURI(url).replace(/["()]/g,'')+'")':'';$('preview').style.backgroundSize='cover';}
function show(){const id=Number($('slot').value);const row=rows.find(r=>r.id===id)||defaults[id-1];fields.forEach(f=>$(f).value=row[f]||'');preview()}
$('slot').onchange=show;fields.forEach(f=>$(f).addEventListener('input',preview));
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/admin/banners.html'}});if(error)$('notice').textContent=error.message};
$('save').onclick=async()=>{const payload={id:Number($('slot').value)};fields.forEach(f=>payload[f]=$(f).value.trim());if(!payload.title||!payload.button_text){$('notice').textContent='Заповни заголовок і текст кнопки.';return}if(!/^(catalog\.html(?:\?[^#]*)?|product\.html(?:\?[^#]*)?|#[-\w]+|\/catalog\.html(?:\?[^#]*)?)$/.test(payload.button_url)){$('notice').textContent='Посилання має вести на каталог або секцію сайту.';return}if(payload.image_url&&!/^https:\/\//.test(payload.image_url)){$('notice').textContent='Для зображення потрібне посилання https://';return} $('save').disabled=true;$('notice').textContent='Зберігаємо…';const {data,error}=await sb.from('home_banners').upsert(payload,{onConflict:'id'}).select().single();$('save').disabled=false;if(error){$('notice').textContent='Помилка: '+error.message;return}rows=rows.filter(r=>r.id!==data.id).concat(data);$('notice').textContent='✅ Банер збережено. Перевір головну сторінку магазину.'};
async function init(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){$('notice').textContent='Увійди через Google.';$('login').hidden=false;return}const role=await sb.from('admin_users').select('role').eq('user_id',user.id).eq('active',true).maybeSingle();if(role.error||role.data?.role!=='owner'){$('notice').textContent='Редагувати банери може лише власник магазину.';return}const result=await sb.from('home_banners').select('*').order('id');if(result.error){$('notice').textContent='Помилка завантаження: '+result.error.message;return}rows=result.data||[];$('editor').hidden=false;$('notice').textContent='Вибери банер, внеси зміни та збережи.';show()}init().catch(e=>$('notice').textContent='Помилка: '+e.message);
</script></body></html>
