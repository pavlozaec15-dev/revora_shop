<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Історія замовлень — REVORA</title><link rel="stylesheet" href="style.css"></head><body>
<div class="topbar">БЕЗКОШТОВНА ДОСТАВКА NOVA POSHTA ВІД 8 000 ₴</div><header><a class="logo" href="index.html">REVORA</a><nav><a href="catalog.html">КАТАЛОГ</a><a href="catalog.html?sort=new">НОВИНКИ</a><a href="catalog.html?sale=1">SALE</a></nav></header>
<main class="accountPage"><section class="accountHero"><small>REVORA ORDERS</small><h1>Історія<br>замовлень</h1><p>Тут зберігаються замовлення, оформлені на цьому пристрої.</p></section><section class="accountGrid" style="grid-template-columns:1fr"><section><div class="accountSectionTitle"><h3>Мої замовлення</h3><a href="catalog.html">ДО КАТАЛОГУ →</a></div><div id="orders"></div></section></section></main>
<script>(function(){var b=document.getElementById('orders'),a=[];try{a=JSON.parse(localStorage.getItem('revoraOrders')||'[]')}catch(e){}if(!a.length){b.innerHTML='<div class="accountEmpty"><p>Історія замовлень поки порожня.</p><a href="catalog.html">ПЕРЕЙТИ ДО КАТАЛОГУ</a></div>';return}b.innerHTML=a.slice().reverse().map(function(o){return '<article class="accountOrder"><div><small>ЗАМОВЛЕННЯ</small><b>#'+(o.number||'RV')+'</b></div><div><small>СТАТУС</small><b>'+(o.status||'Прийнято')+'</b></div><div><small>СУМА</small><b>'+Number(o.total||0).toLocaleString('uk-UA')+' ₴</b></div></article>'}).join('')})();</script></body></html>
