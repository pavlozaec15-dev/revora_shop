<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>REVORA Account</title><link rel="stylesheet" href="style.css?v=account-final-1"></head><body>
<div class="topbar">БЕЗКОШТОВНА ДОСТАВКА NOVA POSHTA ВІД 8 000 ₴</div>
<header><a class="logo" href="index.html">REVORA</a><nav><a href="catalog.html">КАТАЛОГ</a><a href="catalog.html?sort=new">НОВИНКИ</a><a href="catalog.html?sale=1">SALE</a></nav></header>

</div></section></main>
<script>
(function(){
var b=document.getElementById('continueBtn'),n=document.getElementById('accountName'),p=document.getElementById('accountPhone');
function sync(){var q=new URLSearchParams();if(n.value.trim())q.set('name',n.value.trim());if(p.value.trim())q.set('phone',p.value.trim());b.href='account-dashboard.html'+(q.toString()?'?'+q.toString():'');}
n.addEventListener('input',sync);p.addEventListener('input',sync);b.addEventListener('click',sync);
})();
